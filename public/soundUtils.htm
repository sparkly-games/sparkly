<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meme Soundboard</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #ff4ecd, #6c63ff, #00f2ff);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
  }

  @keyframes bg {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .board {
    width: min(900px, 95%);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    padding: 20px;
  }

  .title {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    text-shadow: 0 0 20px #fff;
  }

  button {
    height: 90px;
    border-radius: 18px;
    border: none;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,255,255,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px white;
  }

  button:active {
    transform: scale(0.95);
  }

  .controls {
    grid-column: 1 / -1;
    background: rgba(0,0,0,0.25);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
  }

  .controls label {
    font-weight: 700;
    display: block;
    margin-bottom: 6px;
  }

  .controls input {
    width: 100%;
  }

  .speed {
    text-align: center;
    margin-top: 6px;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="board">
  <div class="title">✨ Sound Utilities ✨</div>
  <button onclick="window.location.href='/soundboard.htm'">Soundboard</button>
  <button onclick="window.location.href='/tts.htm'">Text To Speech</button>
</div>
</body>
</html>
