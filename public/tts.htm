<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native TTS Controller</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #38bdf8; }
        label { display: block; margin: 10px 0 5px; font-size: 0.9rem; color: #94a3b8; }
        textarea, select, input { width: 100%; padding: 10px; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 10px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .status { font-size: 0.8rem; margin-top: 10px; text-align: center; color: #38bdf8; height: 1.2rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Native TTS</h2>
    
    <label>Text to Speak</label>
    <textarea id="textInput" rows="3">I can say anything!</textarea>

    <label>Select Voice (Human-like filtered)</label>
    <select id="voiceSelect"><option>Loading voices...</option></select>

    <div class="row">
        <div>
            <label>Speed (Rate)</label>
            <input type="range" id="rateInput" min="0.5" max="2" step="0.1" value="0.9">
        </div>
        <div>
            <label>Pitch</label>
            <input type="range" id="pitchInput" min="0" max="2" step="0.1" value="1">
        </div>
    </div>

    <label>Start Delay (Seconds)</label>
    <input type="number" id="delayInput" value="0" min="0" max="10">

    <button id="speakBtn">Speak</button>
    <div id="status" class="status"></div>
</div>

<script>
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voiceSelect');
    const speakBtn = document.getElementById('speakBtn');
    const status = document.getElementById('status');
    let voices = [];

    // Populate voice list and prioritize high-quality ones
    function loadVoices() {
        voices = synth.getVoices();
        for(let i = 0; i < voices.length; i++){
            if(!voices[i].lang.includes('en-GB')){
                voices.splice(i, 1); 
                i--;
            }
        }
        if (voices.length === 0) {
            voiceSelect.innerHTML = '<option>No voices found</option>';
            status.innerText = "Browser does not support SpeechSynthesis.";
            return;
        }
        voiceSelect.innerHTML = '';
        
        // Filter and sort: Premium/Google voices first, then others
        const sortedVoices = voices.sort((a, b) => {
            const highQual = (v) => v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium');
            return highQual(b) - highQual(a);
        });

        sortedVoices.forEach((voice) => {
            const option = document.createElement('option');
            const nameEnd = voice.name.indexOf('(') !== -1 ? voice.name.indexOf('(') : voice.name.length;
            option.textContent = `${voice.name.slice(0, nameEnd)}`;
            option.value = voice.name;
            if (voice.default) option.textContent += ' -- DEFAULT';
            voiceSelect.appendChild(option);
        });
    }

    // Voices are loaded asynchronously
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    speakBtn.onclick = async () => {
        const text = document.getElementById('textInput').value;
        const delay = parseInt(document.getElementById('delayInput').value) || 0;
        const rate = document.getElementById('rateInput').value;
        const pitch = document.getElementById('pitchInput').value;

        if (!text || synth.speaking) return;

        speakBtn.disabled = true;
        
        if (delay > 0) {
            status.innerText = `Waiting ${delay}s...`;
            await new Promise(r => setTimeout(r, delay * 1000));
        }

        const utterance = new SpeechSynthesisUtterance(text);
        const selectedVoice = voices.find(v => v.name === voiceSelect.value);
        
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.rate = rate;
        utterance.pitch = pitch;

        utterance.onstart = () => status.innerText = "Speaking...";
        utterance.onend = () => {
            status.innerText = "";
            speakBtn.disabled = false;
        };

        synth.speak(utterance);
    };
</script>

</body>
</html>
